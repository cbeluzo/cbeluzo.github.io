<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Materiais interativos de autoestudo para alunos do 6º e 7º ano do Ensino Fundamental, organizados por disciplina, tema e ano escolar.">
    <title>Apoio ao Ensino Fundamental</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/site.css">

    <style>
      :root {
        --page-hero-bg: radial-gradient(1200px circle at 15% 15%, rgba(25,135,84,.18), transparent 45%),
                        radial-gradient(1200px circle at 80% 30%, rgba(13,110,253,.12), transparent 45%);
      }
    </style>
  </head>

  <body class="bg-light">
    <div id="site-nav"></div>

    <noscript>
      <div class="container py-3">
        <div class="alert alert-warning my-0">Esta página usa JavaScript para montar a navegação e a grade de conteúdo.</div>
      </div>
    </noscript>

    <header class="page-hero py-4 border-bottom">
      <div class="container">
        <h1 class="h3 mb-1" id="section-title"></h1>
        <div class="text-muted" id="section-subtitle"></div>
      </div>
    </header>

    <main class="container my-4" id="section-content"></main>

    <div id="site-footer"></div>

    <!-- Modal Gamificado -->
    <div class="modal fade" id="gamifiedModal" tabindex="-1" aria-labelledby="gamifiedModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-fullscreen-lg-down modal-dialog-centered">
        <div class="modal-content bg-dark border-0 shadow-lg" style="border-radius: 1rem; overflow: hidden;">
          <div class="modal-header border-0 pb-0" style="position: absolute; right: 0; z-index: 10;">
            <button type="button" class="btn-close btn-close-white m-3" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0" style="height: 85vh; min-height: 600px;">
            <iframe src="./material-autoestudo-inteiros-6ano.html" style="width:100%; height:100%; border:none;"></iframe>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
    <script src="../assets/js/site.js"></script>
    <script>
      PortalUI.init({ rootRelative: ".." }).then(() => {
        PortalUI.renderCollectionPage({
        sectionKey: "ensino-fundamental",
        rootRelative: "..",
        idPrefix: "ef"
      });
      });
    </script>
