name: Validate Portal

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript syntax
        run: |
          node -e "const fs=require('fs'); global.window={}; eval(fs.readFileSync('assets/js/site.js','utf8')); if (!window.PortalUI || typeof window.PortalUI.init !== 'function') { throw new Error('PortalUI.init não foi exposto por assets/js/site.js'); } JSON.parse(fs.readFileSync('assets/data/portal-data.json','utf8'));"

      - name: Validate local HTML references
        run: python3 scripts/validate_portal.py

      - name: Ensure no tracked system artifacts
        run: |
          if git ls-files | grep -E '(^|/)\.DS_Store$|(^|/)\.ipynb_checkpoints(/|$)'; then
            echo "Tracked system artifacts found."
            exit 1
          fi
