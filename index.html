<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal - Carlos Eduardo Beluzo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/site.css">

    <style>
      :root {
        --portal-hero-bg: radial-gradient(1200px circle at 10% 10%, rgba(13,110,253,.18), transparent 45%),
                          radial-gradient(1200px circle at 90% 20%, rgba(25,135,84,.14), transparent 45%),
                          radial-gradient(1200px circle at 40% 90%, rgba(220,53,69,.12), transparent 45%);
      }
    </style>
  </head>

  <body class="bg-light">
    <div id="site-nav"></div>

    <noscript>
      <div class="container py-3">
        <div class="alert alert-warning my-0">Este portal usa JavaScript para montar a navegação e o conteúdo principal.</div>
      </div>
    </noscript>

    <header class="hero py-5">
      <div class="container" id="home-hero"></div>
    </header>

    <main class="container my-4" id="home-main"></main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
    <script src="assets/js/portal-data.js"></script>
    <script src="assets/js/site.js"></script>
    <script>
      PortalUI.renderHomePage({ rootRelative: "." });
    </script>
  </body>
</html>
